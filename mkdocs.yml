site_name: Android Interview Prep
site_url: https://tauqir295.github.io/android-interview-prep/
theme:
  name: material
  palette:
    scheme: slate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

nav:
  - 🏠 Home: index.md

  - 📱 Fundamentals:
      - Overview: generated/fundamentals.md

  - 🧠 Kotlin:
      - Overview: generated/kotlin.md

  - 🛠️ Jetpack Compose:
      - Overview: generated/compose.md

  - 🏗️ Architecture:
      - Overview: generated/architecture.md

  - ⚡ Concurrency:
      - Overview: generated/concurrency.md

  - 🌐 Networking & Offline:
      - Overview: generated/networking.md

  - 🚀 Performance & Vitals:
      - Overview: generated/performance.md

  - ⚙️ CI/CD & Release:
      - Overview: generated/cicd.md

  - 🎓 Advanced & Internals:
      - Overview: generated/advanced.md

  - 🤖 2026 Tech:
      - Overview: generated/future-tech.md

  - 🏗️ System Design:
      - Overview: generated/system-design.md

  - 🧪 Testing:
      - Overview: generated/testing.md

  - 💬 Behavioral:
      - Overview: generated/behavioral.md

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight  
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
- id: process-death-lifecycle
  title: What happens to app state when process is killed?
  difficulty: advanced
  tags:
  - android
  - lifecycle
  - process
  standard_answer: "PROCESS DEATH: OS kills app process to free memory (no warning).\n\nBEFORE KILL (chance to save):\n- onSaveInstanceState() called\n- Stored in Bundle\n- Persisted by system\n\nDURING KILL:\n- Process terminated\n- No cleanup callbacks possible\n- In-memory state lost\n- No warning given\n\nON USER RETURN:\n- If Activity saved state:\n  - OS recreates process\n  - onCreate(savedInstanceState) called\n  - App can restore Bundle data\n- If no saved state:\n  - Activity restarted fresh\n  - UI reset\n\nDATA LOSS:\n- In-memory variables lost\n- Unsaved changes lost\n- ViewModels destroyed\n- Connections closed\n\nPRESERVATION STRATEGIES:\n\n1. savedInstanceState:\n- Light data (Bundles, primitives)\n- ~100KB limit\n- Configuration changes + process death\n\n2. ViewModel:\n- Survives configuration changes\n- Lost on process death\n- Use with savedInstanceState\n\n3. Database:\n- Persistent storage\n- Survives everything\n- Use for critical data\n\n4. Preferences:\n- Settings\
    \ persistence\n- Survives everything\n\nBest practice: ViewModel + Room Database + savedInstanceState\nfor robust state management.\n"
  deep_dive: /android-interview-prep/deep-dives/fundamentals/process-death-lifecycle/
- id: multitasking-window-focus
  title: How does multitasking affect activity lifecycle?
  difficulty: intermediate
  tags:
  - android
  - lifecycle
  - multitasking
  standard_answer: 'MULTITASKING SCENARIOS:


    1. SPLIT SCREEN:

    - Two apps visible simultaneously

    - Both in foreground state

    - Both receive onResume()

    - Top activity interactive, other visible


    2. PICTURE-IN-PICTURE:

    - App playing video in small window

    - onPause() called (not visible)

    - Continues running

    - User can interact with background


    3. APP SWITCHING (Recents):

    - Swipe from other app

    - Current Activity: onPause → onStop

    - Switched app: onStart → onResume

    - Current app not destroyed (still in memory)


    LIFECYCLE IMPACT:


    Old app (going background):

    onPause() → onStop()


    New app (coming foreground):

    onStart() (if first time) or

    onStart() → onResume() (if was paused)


    IMPORTANT:

    - onPause() called for BOTH foreground apps

    - Only top activity "interactive"

    - Other visible but not interactive


    CONSEQUENCES:

    - Stop CPU-heavy operations in onPause()

    - Resume operations in onResume()

    - Don''t assume onStop() means background

    - May be visible but not interactive


    Example: Video player in split screen

    - visible but onPause() called

    - Should pause playback in onPause()

    - Resume in onResume()

    '
  deep_dive: /android-interview-prep/deep-dives/fundamentals/multitasking-window-focus/
